[package]
name = "mboot"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Type-1 hypervisor for mochiOS"

[lib]
path = "src/lib.rs"

[[bin]]
name = "mboot"
path = "src/main.rs"
test = false
bench = false
required-features = ["uefi-app"]

[[bin]]
name = "mboot-stage2-probe"
path = "scripts/stage2-probe.rs"
test = false
bench = false
required-features = ["arm-diagnostics"]

[features]
default = []
uefi-app = ["dep:uefi"]
uefi-net = ["uefi-app"]
arm-diagnostics = []

[dependencies]
bootui = { git = "https://github.com/mochiOS/BootUI", rev = "4b0fca76023d9484d33a179946dc0fc5b770dd29" }
mnu-abi = { git = "https://github.com/mochiOS/mnu" }
sha2 = { version = "0.10", default-features = false }
uefi = { version = "0.30", default-features = false, features = ["alloc", "global_allocator"], optional = true }

[build-dependencies]
png = "0.17.16"
sha2 = "0.10"

[lints.rust]
unused = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(system_domain_probe)", "cfg(system_domain_boot)", "cfg(hardware_domain_probe)", "cfg(paired_domains)", "cfg(hardware_boot_disk)", "cfg(firmware_ramfb)"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
