version = 6
toolchain = "nightly-2026-05-14"
disk_size_mib = 1120
esp_size_mib = 256
disk_guid = "6d426f6f-7400-4b00-8a00-000000000200"
esp_guid = "6d426f6f-7400-4b00-8a00-000000000201"
payload_guid = "6d426f6f-7400-4b00-8a00-000000000202"

[[domains]]
id = 1
role = "system"
memory_mib = 512
vcpus = 1
capabilities = 0
format = "native-elf"
image = "mochios-system"
path = '\EFI\MBOOT\MOCHIOS.ELF'
initramfs = "mochios"
initramfs_path = '\EFI\MBOOT\INITFS.IMG'
autostart = true
required = true
restart = "never"
max_restarts = 0

[[channels]]
domain_a = 1
port_a = 1
domain_b = 2
port_b = 1

[[channels]]
domain_a = 1
port_a = 2
domain_b = 2
port_b = 2

[[channels]]
domain_a = 1
port_a = 3
domain_b = 2
port_b = 3

[[channels]]
domain_a = 1
port_a = 4
domain_b = 2
port_b = 4

[[domains]]
id = 2
role = "hardware"
memory_mib = 512
vcpus = 1
capabilities = 0x3
format = "linux-pvh"
image = "mdriver"
path = '\EFI\MBOOT\MDRIVER.ELF'
initramfs = "mdriver"
initramfs_path = '\EFI\MBOOT\MDRIVER.CPIO'
# Stream boot logs until Linux fbcon takes over; no diagnostic probe stops.
# No DHCP or log receiver ACK is required.
command_line = "console=ttyS0 console=tty0 rdinit=/init pci=off acpi=off maxcpus=0 ip=off mboot.text_console=1"
autostart = true
required = true
restart = "never"
max_restarts = 0

# Select display-class PCI functions automatically. This is machine-independent:
# mBoot discovers the actual requester and mDriver chooses the connected output.
# When no IOMMU is available, mBoot drops this optional policy and keeps the
# firmware framebuffer so the desktop can still start without GPU acceleration.
[[devices]]
segment = 0
requester = "auto"
kind = "display"
domain = 2
required = false

# The wired NIC is optional diagnostic transport, not a GPU prerequisite.
[[devices]]
segment = 0
requester = "auto"
kind = "network"
domain = 2
required = false

# mDriver is a trusted hardware Domain. It receives every matching controller
# so Installer.app can show the machine's actual disks without a per-machine BDF.
[[devices]]
segment = 0
requester = "auto"
kind = "nvme"
domain = 2
required = false
writable = true

[[devices]]
segment = 0
requester = "auto"
kind = "vmd"
domain = 2
required = false
writable = true

# The boot medium may be USB. mDriver needs its xHCI controller only to read the
# immutable installer payload; the target remains an explicitly selected disk.
[[devices]]
segment = 0
requester = "auto"
kind = "usb"
domain = 2
required = false
