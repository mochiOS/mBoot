version = 6
toolchain = "nightly-2026-05-14"
disk_size_mib = 1056
esp_size_mib = 192
disk_guid = "6d426f6f-7400-4b00-8a00-000000000200"
esp_guid = "6d426f6f-7400-4b00-8a00-000000000201"
payload_guid = "6d426f6f-7400-4b00-8a00-000000000202"

[[domains]]
id = 1
role = "system"
memory_mib = 512
vcpus = 1
capabilities = 0
format = "native-elf"
image = "mochios-system"
path = '\EFI\MBOOT\MOCHIOS.ELF'
initramfs = "mochios"
initramfs_path = '\EFI\MBOOT\INITFS.IMG'
autostart = true
required = true
restart = "never"
max_restarts = 0

[[channels]]
domain_a = 1
port_a = 1
domain_b = 2
port_b = 1

[[channels]]
domain_a = 1
port_a = 2
domain_b = 2
port_b = 2

[[channels]]
domain_a = 1
port_a = 3
domain_b = 2
port_b = 3

[[channels]]
domain_a = 1
port_a = 4
domain_b = 2
port_b = 4

[[domains]]
id = 2
role = "hardware"
memory_mib = 128
vcpus = 1
capabilities = 0x3
format = "linux-pvh"
image = "mdriver"
path = '\EFI\MBOOT\MDRIVER.ELF'
initramfs = "mdriver"
initramfs_path = '\EFI\MBOOT\MDRIVER.CPIO'
command_line = "earlycon=uart,io,0x3f8 console=ttyS0 rdinit=/init pci=off acpi=off maxcpus=0 panic=-1"
autostart = true
required = true
restart = "never"
max_restarts = 0

# Keep the firmware display active while the native mDriver GPU backend is
# being completed. mBoot maps only the GOP framebuffer into mochiOS; the GPU
# itself remains outside the Hardware Domain and behind its firmware IOMMU
# mapping, so a failed native probe no longer blocks the desktop.

# mDriver is a trusted hardware Domain. It receives every matching controller
# so Installer.app can show the machine's actual disks without a per-machine BDF.
[[devices]]
segment = 0
requester = "auto"
kind = "nvme"
domain = 2
required = false
writable = true

[[devices]]
segment = 0
requester = "auto"
kind = "vmd"
domain = 2
required = false
writable = true

# The boot medium may be USB. mDriver needs its xHCI controller only to read the
# immutable installer payload; the target remains an explicitly selected disk.
[[devices]]
segment = 0
requester = "auto"
kind = "usb"
domain = 2
required = false
