# mBoot appliance configuration. Values are parsed as data, not evaluated.
# Empty selects the online host CPU count, capped by MBOOT_MAX_VCPUS.
MBOOT_VCPUS=
# An empty memory value enables conservative host-based sizing.
MBOOT_MEMORY_MIB=
MBOOT_MAX_VCPUS=8
MBOOT_MAX_MEMORY_MIB=8192
MBOOT_RESERVE_MEMORY_MIB=1536
MBOOT_ACCELERATOR=auto
MBOOT_MACHINE=q35
MBOOT_GUEST_GPU=virtio-vga-gl
# auto uses the active X11 display mode without scaling the guest framebuffer.
MBOOT_GUEST_WIDTH=auto
MBOOT_GUEST_HEIGHT=auto
MBOOT_DISPLAY=sdl
MBOOT_FULLSCREEN=yes
MBOOT_AUDIO=auto
MBOOT_NETWORK=user
# auto uses buffered reads and synchronous writes for the USB-backed guest image.
MBOOT_DISK_CACHE=auto
MBOOT_X_DISPLAY=:0
MBOOT_X_VT=2
MBOOT_LINUX_DISPLAY=:99
