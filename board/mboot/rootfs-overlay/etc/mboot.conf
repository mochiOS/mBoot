# mBoot appliance configuration. Values are parsed as data, not evaluated.
# Empty CPU and memory values enable conservative host-based sizing.
MBOOT_VCPUS=
MBOOT_MEMORY_MIB=
MBOOT_MAX_VCPUS=8
MBOOT_MAX_MEMORY_MIB=8192
MBOOT_RESERVE_MEMORY_MIB=1536
MBOOT_MACHINE=q35
MBOOT_GUEST_GPU=virtio-vga
MBOOT_DISPLAY=sdl
MBOOT_FULLSCREEN=yes
MBOOT_AUDIO=auto
MBOOT_NETWORK=user
MBOOT_DISK_CACHE=auto
MBOOT_X_DISPLAY=:0
MBOOT_X_VT=2
