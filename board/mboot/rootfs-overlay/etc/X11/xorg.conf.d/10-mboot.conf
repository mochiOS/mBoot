Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "InputClass"
    Identifier "mBoot libinput"
    MatchIsKeyboard "on"
    MatchIsPointer "on"
    MatchIsTouchpad "on"
    Driver "libinput"
EndSection
